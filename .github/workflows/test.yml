name: Test

on: [push, pull_request]

env:
  FISH_TEST_MAX_CONCURRENCY: "4"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

permissions:
  contents: read

jobs:
  alpine:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, build_tools/update-dependencies.sh
    - run:
        sh -x docker/docker_run_tests.sh docker/alpine.Dockerfile

  freebsd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, build_tools/update-dependencies.sh
    - uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8, build_tools/update-dependencies.sh
      with:
        # # See https://github.com/vmactions/.github/wiki/debug%E2%80%90on%E2%80%90error
        # debug-on-error: true
        # vnc-password: fish
        usesh: true
        run: |
          pkg update
          # TODO This should be shared with .github/actions/install-dependencies/action.yml
          pkg install -y \
            cmake-core \
            devel/ninja \
            devel/pcre2 \
            gettext \
            git-lite \
            lang/rust \
            misc/py-pexpect \
            python \
            sudo \
          ;
          # BSDs have the following behavior: root may open or access files even if
          # the mode bits would otherwise disallow it. For example root may open()
          # a file with write privileges even if the file has mode 400. This breaks
          # our tests for e.g. cd and path. So create a new unprivileged user to run tests.
          pw user add -n fish-user -s /bin/csh -d /home/fish-user
          mkdir -p /home/fish-user
          chown -R fish-user /home/fish-user
          mkdir build && cd build
          chown -R fish-user ..
          sudo -u fish-user -s whoami
          sudo -u fish-user -s FISH_TEST_MAX_CONCURRENCY=1 cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug ..
          sudo -u fish-user -s ninja fish
          sudo -u fish-user -s env CI=1 ninja fish_run_tests

  ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, build_tools/update-dependencies.sh
    - uses: ./.github/actions/rust-toolchain@oldest-supported
    - name: Install deps
      uses: ./.github/actions/install-dependencies
      with:
        include_sphinx: true
    - name: Generate a locale that uses a comma as decimal separator.
      run: |
        sudo locale-gen fr_FR.UTF-8
    - name: cmake
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: make
      run: |
        make -C build VERBOSE=1
    - name: make fish_run_tests
      run: |
        make -C build VERBOSE=1 fish_run_tests

  ubuntu-32bit-static-pcre2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, build_tools/update-dependencies.sh
    - uses: ./.github/actions/rust-toolchain@oldest-supported
      with:
        targets: "i586-unknown-linux-gnu"
    - name: Update package database
      run: sudo apt-get update
    - name: Install deps
      uses: ./.github/actions/install-dependencies
      with:
        include_pcre: false
        include_sphinx: false
    - name: Install g++-multilib
      run: sudo apt install g++-multilib
    - name: cmake
      env:
          CFLAGS: "-m32"
      run: |
        mkdir build && cd build
        cmake -DFISH_USE_SYSTEM_PCRE2=OFF -DRust_CARGO_TARGET=i586-unknown-linux-gnu ..
    - name: make
      run: |
        make -C build VERBOSE=1
    - name: make fish_run_tests
      run: |
        make -C build VERBOSE=1 fish_run_tests

  ubuntu-asan:
    runs-on: ubuntu-latest
    env:
        # Rust has two different memory sanitizers of interest; they can't be used at the same time:
        # * AddressSanitizer detects out-of-bound access, use-after-free, use-after-return,
        #   use-after-scope, double-free, invalid-free, and memory leaks.
        # * MemorySanitizer detects uninitialized reads.
        #
        RUSTFLAGS: "-Zsanitizer=address"
        # RUSTFLAGS: "-Zsanitizer=memory -Zsanitizer-memory-track-origins"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, build_tools/update-dependencies.sh
    # All -Z options require running nightly
    - uses: dtolnay/rust-toolchain@nightly
      with:
        # ASAN uses `cargo build -Zbuild-std` which requires the rust-src component
        # this is comma-separated
        components: rust-src
    - name: Update package database
      run: sudo apt-get update
    - name: Install deps
      uses: ./.github/actions/install-dependencies
      with:
        include_sphinx: false
    - name: Install llvm
      run: |
        sudo apt install llvm # for llvm-symbolizer
    - name: cmake
      env:
          CC: clang
      run: |
        mkdir build && cd build
        # Rust's ASAN requires the build system to explicitly pass a --target triple. We read that
        # value from CMake variable Rust_CARGO_TARGET.
        cmake .. -DASAN=1 -DRust_CARGO_TARGET=x86_64-unknown-linux-gnu -DCMAKE_BUILD_TYPE=Debug
    - name: make
      run: |
        make -C build VERBOSE=1
    - name: make fish_run_tests
      env:
          FISH_CI_SAN: 1
          ASAN_OPTIONS: check_initialization_order=1:detect_stack_use_after_return=1:detect_leaks=1:fast_unwind_on_malloc=0
          # use_tls=0 is a workaround for LSAN crashing with "Tracer caught signal 11" (SIGSEGV),
          # which seems to be an issue with TLS support in newer glibc versions under virtualized
          # environments. Follow https://github.com/google/sanitizers/issues/1342 and
          # https://github.com/google/sanitizers/issues/1409 to track this issue.
          # UPDATE: this can cause spurious leak reports for __cxa_thread_atexit_impl() under glibc.
          LSAN_OPTIONS: verbosity=0:log_threads=0:use_tls=1:print_suppressions=0
      run: |
        set -x
        export ASAN_SYMBOLIZER_PATH=$(command -v /usr/bin/llvm-symbolizer* | sort -n | head -1)
        export LSAN_OPTIONS="$LSAN_OPTIONS:suppressions=$PWD/build_tools/lsan_suppressions.txt"
        make -C build VERBOSE=1 fish_run_tests

  macos:
    runs-on: macos-latest
    env:
      # macOS runners keep having issues loading Cargo.toml dependencies from git (GitHub) instead
      # of crates.io, so give this a try. It's also sometimes significantly faster on all platforms.
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, build_tools/update-dependencies.sh
    - uses: ./.github/actions/rust-toolchain@oldest-supported
    - name: Install deps
      run: |
        # --break-system-packages because homebrew has now declared itself "externally managed".
        # this is CI so we don't actually care.
        sudo pip3 install --break-system-packages pexpect
        brew install gettext tmux
    - uses: ./.github/actions/install-sphinx
    - name: cmake
      run: |
        mkdir build && cd build
        FISH_TEST_MAX_CONCURRENCY=1 \
          cmake -DCMAKE_BUILD_TYPE=Debug ..
    - name: make
      run: |
        make -C build VERBOSE=1
    - name: make fish_run_tests
      run: |
        make -C build VERBOSE=1 fish_run_tests

  windows-native-build-support:
    runs-on: windows-latest
    env:
      PCRE2_SYS_STATIC: '1'
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, build_tools/update-dependencies.sh
    - uses: dtolnay/rust-toolchain@1.85.0
      with:
        targets: "x86_64-pc-windows-msvc"
    - name: Record native toolchain
      run: |
        New-Item -ItemType Directory -Force native-windows-results | Out-Null
        rustc -Vv | Tee-Object native-windows-results/toolchain.txt
        cargo -V | Tee-Object -Append native-windows-results/toolchain.txt
    - name: W1-VERSION (three required unit cases)
      run: |
        $cases = cargo test --locked -p fish-build-helper --target x86_64-pc-windows-msvc --lib w1_version -- --list 2>&1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $required = @('version::tests::w1_version_archive_fallback: test', 'version::tests::w1_version_matching_git: test', 'version::tests::w1_version_revision_prefix: test')
        $discovered = @($cases | ForEach-Object { if ("$_" -match '^version::tests::w1_version_.*: test$') { "$_" } })
        if (@(Compare-Object ($required | Sort-Object) ($discovered | Sort-Object)).Count -ne 0) { throw "W1-VERSION requires the exact three cases" }
        $output = cargo test --locked -p fish-build-helper --target x86_64-pc-windows-msvc --lib w1_version -- --nocapture 2>&1
        $code = $LASTEXITCODE
        $output | Tee-Object native-windows-results/w1-version.txt
        if ($code -ne 0) { exit $code }
        if (@($output | Select-String '^test result: ok\. 3 passed; 0 failed; 0 ignored;').Count -ne 1) { throw "W1-VERSION must execute all three cases without skips" }
    - name: W1-HOST (isolated tool-free native archive)
      run: |
        $cases = cargo test --locked -p fish-build-helper --target x86_64-pc-windows-msvc --test host -- --list 2>&1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (@($cases | Select-String '^w1_host: test$').Count -ne 1) { throw "W1-HOST case missing" }
        $output = cargo test --locked -p fish-build-helper --target x86_64-pc-windows-msvc --test host -- --exact w1_host --nocapture 2>&1
        $code = $LASTEXITCODE
        $output | Tee-Object native-windows-results/w1-host.txt
        if ($code -ne 0) { exit $code }
        if (@($output | Select-String '^test result: ok\. 1 passed; 0 failed; 0 ignored;').Count -ne 1) { throw "W1-HOST must execute without skips" }
    - name: Provision required native filesystem fixtures
      run: |
        $ErrorActionPreference = 'Stop'
        $developer = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
        New-Item -Path $developer -Force | Out-Null
        New-ItemProperty -Path $developer -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
        New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null
        $root = Join-Path $env:RUNNER_TEMP 'fish-native-n1-share'
        New-Item -ItemType Directory -Path $root -Force | Out-Null
        $absolute = [IO.Path]::GetFullPath($root)
        $unc = '\\localhost\' + $absolute.Substring(0, 1) + '$' + $absolute.Substring(2)
        $probe = Join-Path $unc 'fixture-capability.txt'
        [IO.File]::WriteAllText($probe, 'native UNC fixture')
        if ([IO.File]::ReadAllText($probe) -ne 'native UNC fixture') { throw 'Required UNC fixture is not writable' }
        Remove-Item $probe
        Add-Content $env:GITHUB_ENV "FISH_NATIVE_N1_UNC_ROOT=$unc"
        @("OS=$([Environment]::OSVersion.Version)", "UNC=$unc", "DeveloperMode=1", "LongPathsEnabled=1") |
          Tee-Object native-windows-results/filesystem-host.txt
        Get-Volume -DriveLetter $absolute.Substring(0, 1) |
          Select-Object DriveLetter, FileSystemType, HealthStatus |
          Out-String | Tee-Object -Append native-windows-results/filesystem-host.txt
    - name: Build native fish, formatter, key reader and probe profiles
      run: |
        New-Item -ItemType Directory -Force native-windows-results | Out-Null
        cargo build --locked --target x86_64-pc-windows-msvc --no-default-features --bin fish --bin fish_indent --bin fish_key_reader --bin windows_native_probe --bin windows_n5_gui_probe 2>&1 | Tee-Object native-windows-results/build-debug.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo build --locked --target x86_64-pc-windows-msvc --no-default-features --release --bin fish --bin fish_indent --bin fish_key_reader --bin windows_native_probe --bin windows_n5_gui_probe 2>&1 | Tee-Object native-windows-results/build-release.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Native GOAL leaf, library, initialization and acceptance gates
      run: |
        function Invoke-NativeTests {
          param([string]$Name, [string[]]$CargoArgs, [string[]]$Required = @(), [switch]$Exact)
          $base = @('test', '--locked', '--target', 'x86_64-pc-windows-msvc', '--no-default-features') + $CargoArgs
          $harness = @()
          if ($Exact) { $harness += '--exact' }
          $listing = & cargo @base -- @harness --list 2>&1
          $code = $LASTEXITCODE
          $listing | Tee-Object "native-windows-results/$Name-discovery.txt"
          if ($code -ne 0) { throw "$Name discovery failed ($code)" }
          $cases = @($listing | ForEach-Object { if ("$_" -match '^(.+): test$') { $Matches[1] } })
          if ($cases.Count -eq 0) { throw "$Name discovered zero tests" }
          if ($Required.Count -gt 0) {
            if (@(Compare-Object ($Required | Sort-Object) ($cases | Sort-Object)).Count -ne 0) {
              throw "$Name did not discover exactly the required cases"
            }
          }
          $output = & cargo @base -- @harness --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object "native-windows-results/$Name.txt"
          if ($code -ne 0) { throw "$Name failed ($code)" }
          $summary = @($output | Select-String '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;')
          if ($summary.Count -ne 1) { throw "$Name must execute tests without skips" }
          return
        }

        Invoke-NativeTests -Name w2-codecs -CargoArgs @('-p', 'fish-widestring', '--lib', 'w2_') -Required @(
          'tests::w2_text_native_os_roundtrip',
          'tests::w2_invalid_native_os_rejects',
          'tests::w2_invalid_redirected_bytes_roundtrip',
          'tests::w2_text_native_shell_roundtrip',
          'tests::w2_invalid_shell_identity_rejects'
        )
        Invoke-NativeTests -Name w2-tempfile -CargoArgs @('-p', 'fish-tempfile', '--test', 'runtime') -Required @(
          'w2_runtime_tempfile_collision_and_cleanup',
          'creation_errors_are_not_retried_as_collisions'
        )
        foreach ($package in @('fish-widestring', 'fish-tempfile', 'fish-common', 'fish-util', 'fish')) {
          Invoke-NativeTests -Name "$package-lib" -CargoArgs @('-p', $package, '--lib')
        }
        $libraryCases = Get-Content native-windows-results/fish-lib-discovery.txt
        foreach ($case in @(
          'env::environment::native::tests::w4_scopes_native_export_selection',
          'env::environment::native::tests::w4_env_native_path_and_name_policy',
          'proc::native_status::tests::native_exit_codes_keep_raw_bits_and_map_shell_status',
          'proc::native_status::tests::builtin_and_empty_statuses_are_not_native_exit_codes',
          'proc::native_status::tests::io_failure_preserves_native_completion_and_prior_failure_precedence',
          'exec::native_launch::tests::assignment_quota_rollback_preserves_host',
          'input::windows::tests::unicode_record_commits_and_repeats',
          'input::windows::tests::modified_physical_keys_remain_bindable',
          'input::windows::tests::malformed_console_unicode_has_no_replacement_or_cross_epoch_tail',
          'input::windows::tests::nested_consumers_share_scalar_tails_and_repeat_boundaries',
          'input::windows::tests::physical_text_controls_cannot_escape_an_active_paste',
          'input::windows::tests::native_nul_chords_preserve_text_and_legacy_binding_identity',
          'input::input::tests::native_query_yields_without_consuming_later_reader_input',
          'native_text::tests::encoded_scalar_boundaries_and_prefixes',
          'native_text::tests::all_encoded_lengths_and_ordinary_codepoints',
          'native_text::tests::malformed_escaped_bytes_stay_byte_wise',
          'editable_line::tests::native_reserved_scalar_backspace_and_delete',
          'editable_line::tests::native_cursor_admission_and_selection_replacement',
          'editable_line::tests::native_insertion_admission_and_scalar_coalescing',
          'editable_line::tests::native_count_tracks_bytes_joining_and_separating_at_splice_seams',
          'clipboard_windows::tests::private_station_provider_regression',
          'termsize::tests::test_termsize'
        )) {
          if (@($libraryCases | Where-Object { $_ -eq "$($case): test" }).Count -ne 1) {
            throw "Required native library case missing: $case"
          }
        }
        foreach ($profile in @('debug', 'release')) {
          $profileArgs = @()
          if ($profile -eq 'release') { $profileArgs += '--release' }
          Invoke-NativeTests -Name "runtime-initialization-$profile" -CargoArgs ($profileArgs + @('--test', 'windows_native', 'native_runtime_initialization')) -Required @('native_runtime_initialization') -Exact
          Invoke-NativeTests -Name "native-text-provenance-$profile" -CargoArgs ($profileArgs + @('--test', 'windows_native', 'native_text_provenance')) -Required @('native_text_provenance') -Exact
        }
        $env:FISH_NATIVE_TEST_BIN = (Resolve-Path 'target/x86_64-pc-windows-msvc/debug/fish.exe').Path
        $env:FISH_NATIVE_TEST_RELEASE_BIN = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/fish.exe').Path
        $env:FISH_NATIVE_TEST_PROBE = (Resolve-Path 'target/x86_64-pc-windows-msvc/debug/windows_native_probe.exe').Path
        $env:FISH_NATIVE_TEST_RELEASE_PROBE = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/windows_native_probe.exe').Path
        $env:FISH_NATIVE_N5_GUI_FIXTURE = (Resolve-Path 'target/x86_64-pc-windows-msvc/debug/windows_n5_gui_probe.exe').Path
        $env:FISH_NATIVE_N5_RELEASE_GUI_FIXTURE = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/windows_n5_gui_probe.exe').Path
        $env:FISH_NATIVE_N6_KEY_READER = (Resolve-Path 'target/x86_64-pc-windows-msvc/debug/fish_key_reader.exe').Path
        $env:FISH_NATIVE_N6_RELEASE_KEY_READER = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/fish_key_reader.exe').Path
        $env:FISH_NATIVE_N6_EVIDENCE_ROOT = Join-Path (Get-Location) 'native-windows-results/n6-console'
        Invoke-NativeTests -Name native-acceptance -CargoArgs @('--test', 'windows_native', 'native_required_acceptance_cases') -Required @('native_required_acceptance_cases') -Exact
        $required = @('W2-RUNTIME', 'W3-BYTES', 'W3-ERRORS', 'W3-LIFETIME', 'W3-CONSOLE', 'W4-PATHS', 'W5-LANGUAGE', 'W5-NO-CONFIG', 'W5-REJECT', 'W6-CHILD', 'W6-STREAMS', 'W6-STATUS', 'W6-FAILURE', 'W6-BOUNDARY', 'W6-CLEAN-RUN')
        $passes = @(Get-Content native-windows-results/native-acceptance.txt | Where-Object { $_ -match '^PASS (debug|release) ' })
        $expected = @(foreach ($profile in @('debug', 'release')) { foreach ($case in $required) { "PASS $profile $case" } })
        if ($passes.Count -ne 30 -or @(Compare-Object ($expected | Sort-Object) ($passes | Sort-Object)).Count -ne 0) {
          throw "Native acceptance must execute the exact 15-case registry in both profiles"
        }
        foreach ($phase in @(
          @{ Name = 'n1'; Tests = @('N1_PATHS', 'N1_DISCOVERY', 'N1_GLOB'); Gates = @('N1-PATHS', 'N1-DISCOVERY', 'N1-GLOB') },
          @{ Name = 'n2'; Tests = @('N2_STREAM', 'N2_REDIRECT', 'N2_LIFETIME'); Gates = @('N2-STREAM', 'N2-REDIRECT', 'N2-LIFETIME') },
          @{ Name = 'n3'; Tests = @('N3_LANGUAGE', 'N3_CAPTURE', 'N3_SCRIPTS'); Gates = @('N3-LANGUAGE', 'N3-CAPTURE', 'N3-SCRIPTS') },
          @{ Name = 'n4'; Tests = @('N4_STARTUP', 'N4_SHARING', 'N4_RECOVERY'); Gates = @('N4-STARTUP', 'N4-SHARING', 'N4-RECOVERY') },
          @{ Name = 'n5'; Tests = @('N5_JOBS', 'N5_CANCEL', 'N5_ACCOUNT'); Gates = @('N5-JOBS', 'N5-CANCEL', 'N5-ACCOUNT') },
          @{ Name = 'n6'; Tests = @('n6_editor', 'n6_child', 'n6_tools'); Gates = @('N6-EDITOR', 'N6-CHILD', 'N6-TOOLS') }
        )) {
          foreach ($profile in @('debug', 'release')) {
            $profileArgs = @()
            if ($profile -eq 'release') { $profileArgs += '--release' }
            if ($phase.Name -eq 'n5') {
              # The real target-quota rejection needs private backend ownership,
              # not an invalid assumption about enclosing-job UI restrictions.
              $assignmentCase = 'exec::native_launch::tests::assignment_quota_rollback_preserves_host'
              Invoke-NativeTests -Name "native-n5-assignment-$profile" -CargoArgs ($profileArgs + @('--lib', $assignmentCase)) -Required @($assignmentCase) -Exact
            }
            $name = "native-$($phase.Name)-$profile"
            Invoke-NativeTests -Name $name -CargoArgs ($profileArgs + @('--test', "windows_$($phase.Name)")) -Required $phase.Tests -Exact
            $prefix = $phase.Name.ToUpperInvariant()
            $passes = @(Get-Content "native-windows-results/$name.txt" | Where-Object { $_ -match "^PASS (debug|release) $prefix-" })
            $expected = @(foreach ($artifact in @('debug', 'release')) {
              foreach ($case in $phase.Gates) { "PASS $artifact $case" }
            })
            if ($passes.Count -ne 6 -or @(Compare-Object ($expected | Sort-Object) ($passes | Sort-Object)).Count -ne 0) {
              throw "$prefix must execute the exact three required IDs against both artifacts in the $profile harness"
            }
            if ($phase.Name -eq 'n3') {
              $cases = @(
                'N3-LANGUAGE/control-functions-events', 'N3-LANGUAGE/portable-builtins',
                'N3-LANGUAGE/string-regex', 'N3-LANGUAGE/declarative-metadata',
                'N3-CAPTURE/capture-pipelines', 'N3-CAPTURE/buffered-read',
                'N3-SCRIPTS/invocation-source-profile', 'N3-SCRIPTS/formatter'
              )
              $casePasses = @(Get-Content "native-windows-results/$name.txt" | Where-Object { $_ -match '^PASS-CASE (debug|release) N3-' })
              $expectedCases = @(foreach ($artifact in @('debug', 'release')) {
                foreach ($case in $cases) { "PASS-CASE $artifact $case" }
              })
              if ($casePasses.Count -ne 16 -or @(Compare-Object ($expectedCases | Sort-Object) ($casePasses | Sort-Object)).Count -ne 0) {
                throw "N3 must execute every mapped behavioral family against both artifacts in the $profile harness"
              }
            }
            if ($phase.Name -eq 'n4') {
              $cases = @(
                'N4-STARTUP/configuration-autoload-save', 'N4-STARTUP/history-modes',
                'N4-SHARING/universal-values-events', 'N4-SHARING/storage-transactions',
                'N4-SHARING/history-sessions', 'N4-SHARING/locale-timezone',
                'N4-RECOVERY/universal-formats-errors', 'N4-RECOVERY/storage-crash-acl',
                'N4-RECOVERY/autoload-save-errors', 'N4-RECOVERY/history-recovery',
                'N4-RECOVERY/directory-notifications'
              )
              $casePasses = @(Get-Content "native-windows-results/$name.txt" | Where-Object { $_ -match '^PASS-CASE (debug|release) N4-' })
              $expectedCases = @(foreach ($artifact in @('debug', 'release')) {
                foreach ($case in $cases) { "PASS-CASE $artifact $case" }
              })
              if ($casePasses.Count -ne 22 -or @(Compare-Object ($expectedCases | Sort-Object) ($casePasses | Sort-Object)).Count -ne 0) {
                throw "N4 must execute the exact eleven behavioral families against both artifacts in the $profile harness"
              }
            }
            if ($phase.Name -eq 'n5') {
              $cases = @(
                'N5-JOBS/native-mixed-background-progress',
                'N5-JOBS/background-nul-explicit-file-pipe',
                'N5-JOBS/visible-jobs-options-native-group-identities',
                'N5-JOBS/wait-cached-multi-any-duplicate-invalid',
                'N5-JOBS/process-job-caller-shell-events-late-reentrant',
                'N5-JOBS/callback-disown-after-active-wait-captures-handles',
                'N5-JOBS/early-member-not-whole-job-late-replay',
                'N5-JOBS/late-targeted-replay-block-removal-callback-drain',
                'N5-JOBS/disown-ordinary-graceful-shell-exit-survival',
                'N5-JOBS/under-construction-deferred-streaming-function-scheduling',
                'N5-JOBS/retained-pid-cache-callback-drain-partial-rollback',
                'N5-JOBS/actual-shell-partial-pipeline-no-orphan',
                'N5-CANCEL/console-receipt-rearm-shutdown',
                'N5-CANCEL/cooperative-ignored-forced-unsupported',
                'N5-CANCEL/blocked-read-pipe-evaluator',
                'N5-CANCEL/close-and-native-status-provenance',
                'N5-ACCOUNT/owner-process-job-counters-transition-cutoff',
                'N5-ACCOUNT/owner-query-arithmetic-output-faults',
                'N5-ACCOUNT/builtin-cpu-time', 'N5-ACCOUNT/native-cpu-time',
                'N5-ACCOUNT/concurrent-native-pipeline-cpu-time',
                'N5-ACCOUNT/nested-child-cpu-time',
                'N5-ACCOUNT/cached-completion-no-recharge',
                'N5-ACCOUNT/print-rusage-self-native-units-unavailable-categories',
                'N5-ACCOUNT/time-rusage-output-failure-preserves-stdout-status'
              )
              $casePasses = @(Get-Content "native-windows-results/$name.txt" | Where-Object { $_ -match '^PASS-CASE (debug|release) N5-' })
              $expectedCases = @(foreach ($artifact in @('debug', 'release')) {
                foreach ($case in $cases) { "PASS-CASE $artifact $case" }
              })
              if ($casePasses.Count -ne 50 -or @(Compare-Object ($expectedCases | Sort-Object) ($casePasses | Sort-Object)).Count -ne 0) {
                throw "N5 must execute all 25 integration families against both artifacts plus the required private assignment owner case in the $profile harness"
              }
            }
            if ($phase.Name -eq 'n6') {
              $cases = @(
                'N6-EDITOR/utility-free-default-first-prompt',
                'N6-EDITOR/interactive-startup-order-private-login-profiles',
                'N6-EDITOR/interactive-noexecute-and-option-errors',
                'N6-EDITOR/native-record-unicode-repeats-modifiers',
                'N6-EDITOR/navigation-delete-undo-selection-kill-yank-modes',
                'N6-EDITOR/multiline-paste-no-execute-single-undo',
                'N6-EDITOR/viewport-resize-overrides-screen',
                'N6-EDITOR/typed-native-control-recovery-and-eof',
                'N6-CHILD/tui-exclusive-input-protocol-mode-reclaim',
                'N6-CHILD/failed-launch-editor-recovery',
                'N6-CHILD/ignored-break-keeps-donation-until-release',
                'N6-CHILD/control-handler-explicit-exit-seven',
                'N6-CHILD/interactive-background-nul-file-pipe',
                'N6-TOOLS/key-reader-all-option-aliases-stream-errors',
                'N6-TOOLS/standalone-console-key-decoding-continuous',
                'N6-TOOLS/builtin-key-reader-nested-stream-ownership',
                'N6-TOOLS/interactive-read-silent-nchars-newline-null-cancel',
                'N6-TOOLS/commandline-buffer-context-binding-errors',
                'N6-TOOLS/nested-breakpoint-scope-context-restoration',
                'N6-TOOLS/private-logon-station-editor-clipboard'
              )
              $casePasses = @(Get-Content "native-windows-results/$name.txt" | Where-Object { $_ -match '^PASS-CASE (debug|release) N6-' })
              $expectedCases = @(foreach ($artifact in @('debug', 'release')) {
                foreach ($case in $cases) { "PASS-CASE $artifact $case" }
              })
              if ($casePasses.Count -ne 40 -or @(Compare-Object ($expectedCases | Sort-Object) ($casePasses | Sort-Object)).Count -ne 0) {
                throw "N6 must execute all 20 native console/tool families against both artifacts in the $profile harness"
              }
            }
          }
        }
    - name: Upload native Windows evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, build_tools/update-dependencies.sh
      with:
        name: windows-native-goal
        if-no-files-found: error
        path: |
          native-windows-results/
          target/x86_64-pc-windows-msvc/debug/fish.exe
          target/x86_64-pc-windows-msvc/debug/fish_indent.exe
          target/x86_64-pc-windows-msvc/debug/fish_key_reader.exe
          target/x86_64-pc-windows-msvc/debug/windows_native_probe.exe
          target/x86_64-pc-windows-msvc/debug/windows_n5_gui_probe.exe
          target/x86_64-pc-windows-msvc/release/fish.exe
          target/x86_64-pc-windows-msvc/release/fish_indent.exe
          target/x86_64-pc-windows-msvc/release/fish_key_reader.exe
          target/x86_64-pc-windows-msvc/release/windows_native_probe.exe
          target/x86_64-pc-windows-msvc/release/windows_n5_gui_probe.exe

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, build_tools/update-dependencies.sh
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0, build_tools/update-dependencies.sh
      with:
        update: true
        msystem: MSYS
      id: msys2
    - name: Install deps
      # Not using setup-msys2 `install` option to make it easier to copy/paste
      run: |
        pacman --noconfirm -S --needed git rust python3 diffutils tmux
    - name: rebase
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      shell: cmd
      run: |
        "%MSYS2_LOCATION%\usr\bin\dash" /usr/bin/rebaseall -p -v
    - name: check
      env:
        FISH_CHECK_LINT: false
      run: |
        cargo xtask check
